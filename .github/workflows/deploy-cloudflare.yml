name: Deploy to Cloudflare

# 本番 (Cloudflare Workers + D1) へのデプロイ。
# 手順: テスト → 本番DBのバックアップ → マイグレーション (列の追加のみ) → デプロイ → 動作確認
# 必要な GitHub Secrets は docs/OPERATIONS.md を参照。未設定なら何もせずに終わる。
on:
  push:
    branches: [main, claude/fitness-memo-app-y11vfx]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 復元などで別の DB に切り替えるときだけ設定 (通常は空でよい)
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: 設定の確認
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップしました (docs/OPERATIONS.md)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${{ secrets.BACKUP_PASSPHRASE }}" ]; then
            echo "::error::BACKUP_PASSPHRASE が未設定です。バックアップなしではデプロイしません"
            [ -z "$CLOUDFLARE_API_TOKEN" ] || exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.skip != '1'
        run: npm ci
      - name: テスト
        if: steps.cfg.outputs.skip != '1'
        run: npm run check:secrets && npm run typecheck && npm test && npm run build:platform
      - name: D1 データベースの特定 (無ければ作成)
        if: steps.cfg.outputs.skip != '1'
        run: node scripts/ci-resolve-d1.mjs
      - name: 本番データのバックアップ (暗号化)
        if: steps.cfg.outputs.skip != '1'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p out
          npx wrangler d1 export cf-memo --remote --output out/predeploy.sql
          gzip -9 out/predeploy.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in out/predeploy.sql.gz -out out/cf-memo-predeploy-${{ github.run_id }}.sql.gz.enc
          rm out/predeploy.sql.gz
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          name: predeploy-backup-${{ github.run_id }}
          path: out/*.enc
          retention-days: 90
          if-no-files-found: error
      - name: デプロイ前の行数を記録
        if: steps.cfg.outputs.skip != '1'
        run: node scripts/ci-count-rows.mjs save
      - name: マイグレーション (未適用のものだけ)
        if: steps.cfg.outputs.skip != '1'
        run: npx wrangler d1 migrations apply cf-memo --remote
      - name: デプロイ
        if: steps.cfg.outputs.skip != '1'
        run: npx wrangler deploy
      - name: 秘密設定 (Access・APIトークン) を Worker に登録
        if: steps.cfg.outputs.skip != '1'
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ALLOWED_SERVICE_TOKEN_IDS: ${{ secrets.ALLOWED_SERVICE_TOKEN_IDS }}
        run: |
          node -e '
            const keys = ["ACCESS_TEAM_DOMAIN","ACCESS_AUD","ALLOWED_EMAILS","API_TOKEN","ALLOWED_SERVICE_TOKEN_IDS"];
            const o = Object.fromEntries(keys.filter(k => process.env[k]).map(k => [k, process.env[k]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(o));
            console.log("登録する項目:", Object.keys(o).join(", ") || "(なし)");
          '
          npx wrangler secret bulk secrets.json
          rm secrets.json
      - name: データが減っていないことを確認
        if: steps.cfg.outputs.skip != '1'
        run: node scripts/ci-count-rows.mjs check
      - name: 動作確認
        if: steps.cfg.outputs.skip != '1' && vars.CFM_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.CFM_URL }}/api/health")
          echo "health: $code"
          # Access 配下ならログイン画面 (302) が返る。どちらでもなければ失敗
          [ "$code" = "200" ] || [ "$code" = "302" ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.CFM_URL }}/api/meta")
          echo "未認証で /api/meta: $code (401 か 302 なら正常)"
          [ "$code" = "401" ] || [ "$code" = "302" ] || exit 1
